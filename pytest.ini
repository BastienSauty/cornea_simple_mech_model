[pytest]
# Run from the repository root (/workspace in the container): python3 -m pytest
testpaths = Testing_tools
# "." makes Simulation_Framework and Meshing_tools importable; Meshing_tools itself is
# added because its modules import each other as top-level modules (mesh_generation, coons, ...).
pythonpath = . Meshing_tools
markers =
    slow: refinement studies and larger meshes (deselect with -m "not slow")
addopts = -ra --strict-markers